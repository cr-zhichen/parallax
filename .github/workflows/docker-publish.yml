name: Docker Image CI

# 仅在 GitHub Release 发布时构建并推送镜像。
on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Docker Compose
        env:
          PARALLAX_CI_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: docker compose -f docker-compose.ci.yml build --pull parallax

      - name: Determine floating tag
        id: floating
        run: |
          ref="$IMAGE_TAG"

          if [[ "$ref" != *-* ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          suffix="${ref#*-}"
          channel=$(printf '%s' "$suffix" | sed -E 's/^([[:alpha:]]+).*/\1/' | tr '[:upper:]' '[:lower:]')
          case "$channel" in
            rc|beta|alpha)
              echo "tag=$channel" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "tag=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Push release image
        env:
          PARALLAX_CI_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: docker compose -f docker-compose.ci.yml push parallax

      - name: Tag image with floating tag
        if: steps.floating.outputs.tag != ''
        env:
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          FLOATING_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.floating.outputs.tag }}
        run: docker tag "$RELEASE_IMAGE" "$FLOATING_IMAGE"

      - name: Push floating tag
        if: steps.floating.outputs.tag != ''
        env:
          FLOATING_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.floating.outputs.tag }}
        run: docker push "$FLOATING_IMAGE"
