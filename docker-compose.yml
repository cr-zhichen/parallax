services:
  fix-data-perms:
    image: alpine:3.21
    user: "0:0"
    volumes:
      - ./data:/data
    command:
      - sh
      - -ec
      - |
        mkdir -p /data
        chown -R 1001:1001 /data
    restart: "no"

  parallax:
    image: ${PARALLAX_IMAGE:-ghcr.io/cr-zhichen/parallax:latest}
    ports:
      - "${PARALLAX_PORT:-3000}:3000"
    depends_on:
      fix-data-perms:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      ARTIFICIAL_ANALYSIS_API_KEY: ${ARTIFICIAL_ANALYSIS_API_KEY:-}
      ARTIFICIAL_ANALYSIS_API_TIER: ${ARTIFICIAL_ANALYSIS_API_TIER:-free}
      PARALLAX_CATALOG_CACHE_PATH: ${PARALLAX_CATALOG_CACHE_PATH:-/app/data/model-catalog.json}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
